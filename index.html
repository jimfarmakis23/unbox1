<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>YouTube Videos - Dark Mode</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      color: #ffffff;
      text-align: center;
      margin-bottom: 30px;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 400;
      letter-spacing: 1px;
    }

    #video-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Τετράγωνο container για κάθε βίντεο */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 100%;
      background-color: #2d2d2d;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .video-wrapper:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 12px rgba(0, 0, 0, 0.4);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      background-color: #000;
    }

    /* Thumbnail placeholder (αντί για iframe από την αρχή) */
    .video-thumb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .video-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.05) contrast(1.05);
    }

    /* Play button overlay */
    .video-thumb::after {
      content: "";
      width: 64px;
      height: 64px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      position: absolute;
    }

    .video-thumb::before {
      content: "";
      position: absolute;
      width: 0;
      height: 0;
      border-left: 18px solid #fff;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      transform: translateX(4px);
      z-index: 1;
    }

    .video-thumb:hover::after { background: rgba(0, 0, 0, 0.7); }

    /* Loading και error messages */
    .loading, .error-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #ffffff;
      background-color: #2d2d2d;
      border-radius: 12px;
      font-size: 1.1rem;
    }

    .error-message {
      color: #ff6b6b;
      background-color: #2d2d2d;
      border: 1px solid #ff6b6b;
    }

    /* Mobile: 2 στήλες */
    @media screen and (max-width: 768px) {
      body { padding: 10px; }

      #video-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .video-wrapper { border-radius: 8px; }
    }

    /* Μικρά κινητά: 1 στήλη */
    @media screen and (max-width: 480px) {
      #video-container {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      h1 { margin-bottom: 20px; }
    }

    /* Σκοτεινή μπάρα κύλισης */
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: #2d2d2d; }
    ::-webkit-scrollbar-thumb { background: #666; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #888; }
  </style>
</head>

<body>
  <h1>YouTube Videos</h1>

  <div id="video-container">
    <div class="loading">Φόρτωση βίντεο...</div>
  </div>

  <script>
    function getVideoId(url) {
      try {
        url = url.trim();

        const patterns = [
          /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
          /youtube\.com\/watch\?.+&v=([^&\n?#]+)/
        ];

        for (let pattern of patterns) {
          const match = url.match(pattern);
          if (match) return match[1];
        }

        const urlObj = new URL(url);
        return urlObj.searchParams.get('v');
      } catch (e) {
        console.error('Error parsing URL:', url);
        return null;
      }
    }

    // Θέλεις privacy-enhanced embeds; (συνήθως καλό)
    const EMBED_BASE = "https://www.youtube-nocookie.com/embed/";
    // Αν θες το κανονικό:
    // const EMBED_BASE = "https://www.youtube.com/embed/";

    fetch('data/links.txt')
      .then(response => {
        if (!response.ok) {
          throw new Error(`Το αρχείο data/links.txt δεν βρέθηκε (Status: ${response.status})`);
        }
        return response.text();
      })
      .then(text => {
        const container = document.getElementById('video-container');
        container.innerHTML = '';

        const links = text.split('\n')
          .map(line => line.trim())
          .filter(line => line && !line.startsWith('#'));

        if (links.length === 0) {
          container.innerHTML = '<div class="error-message">Δεν βρέθηκαν links στο αρχείο</div>';
          return;
        }

        // Lazy-load thumbnails ΜΟΝΟ όταν πλησιάζουν στο viewport
        const observer = new IntersectionObserver((entries, obs) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;

            const thumb = entry.target;
            const videoId = thumb.dataset.videoId;

            // Δημιούργησε thumbnail μόνο τώρα
            const img = document.createElement('img');
            const maxres = `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`;
            const hq = `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;

            img.loading = "lazy";
            img.decoding = "async";
            img.src = maxres;
            img.onerror = () => { img.src = hq; };

            thumb.appendChild(img);
            obs.unobserve(thumb);
          }
        }, {
          root: null,
          rootMargin: "300px",
          threshold: 0.01
        });

        links.forEach(link => {
          const videoId = getVideoId(link);

          if (videoId && videoId.length === 11) {
            const wrapper = document.createElement('div');
            wrapper.className = 'video-wrapper';

            // Placeholder (thumbnail + play)
            const thumb = document.createElement('div');
            thumb.className = 'video-thumb';
            thumb.dataset.videoId = videoId;
            thumb.setAttribute('role', 'button');
            thumb.setAttribute('tabindex', '0');
            thumb.setAttribute('aria-label', 'Play video');

            function loadIframe() {
              // Αν έχει ήδη φορτώσει, μην το ξανακάνεις
              if (wrapper.querySelector('iframe')) return;

              const iframe = document.createElement('iframe');
              iframe.src = `${EMBED_BASE}${videoId}?autoplay=1`;
              iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
              iframe.allowFullscreen = true;
              iframe.loading = "eager";
              iframe.title = "YouTube video player";

              wrapper.innerHTML = '';
              wrapper.appendChild(iframe);
            }

            thumb.addEventListener('click', loadIframe);
            thumb.addEventListener('keydown', (e) => {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                loadIframe();
              }
            });

            wrapper.appendChild(thumb);
            container.appendChild(wrapper);

            // Παρακολούθησε για να φορτώσει thumbnail όταν πλησιάζει
            observer.observe(thumb);
          } else {
            console.error('Μη έγκυρο video ID από:', link);
          }
        });
      })
      .catch(error => {
        document.getElementById('video-container').innerHTML =
          `<div class="error-message">
              ❌ Σφάλμα: ${error.message}<br><br>
              Βεβαιώσου ότι:<br>
              1. Το αρχείο data/links.txt υπάρχει στο repository<br>
              2. Το index.html είναι στο root φάκελο<br>
              3. Τα links είναι σωστά (ένα σε κάθε γραμμή)
           </div>`;
      });
  </script>
</body>
</html>
