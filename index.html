<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>YouTube Gallery - Light on iframes</title>

  <!-- Preconnect για γρήγορα thumbnails -->
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <link rel="dns-prefetch" href="https://i.ytimg.com">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      color: #ffffff;
      text-align: center;
      margin-bottom: 26px;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 400;
      letter-spacing: 1px;
    }

    #video-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      max-width: 1680px;
      margin: 0 auto;
    }

    .video-card {
      background-color: #2d2d2d;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;                /* γίνεται ολόκληρη κλικ */
    }
    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px rgba(0,0,0,0.5);
    }

    /* 16:10 aspect ratio όπως πριν, αλλά τώρα με thumbnail ή iframe */
    .video-media {
      position: relative;
      width: 100%;
      padding-bottom: 62.5%; /* 10/16 = 0.625 */
      background: #0f0f0f;
    }

    .thumbnail-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background-color: #2a2a2a;
      display: block;
    }

    /* το iframe θα εμφανίζεται μόνο όταν γίνει κλικ */
    .video-media iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    /* overlay play (προαιρετικό, για να φαίνεται πιο φιλικό) */
    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;  /* δεν εμποδίζει το κλικ */
    }
    .video-card:hover .play-overlay {
      opacity: 1;
    }
    .play-icon {
      width: 60px;
      height: 60px;
      background: rgba(255,0,0,0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      color: white;
      padding-left: 6px; /* μικρή μετατόπιση για το τρίγωνο */
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .video-title {
      color: #fff;
      padding: 10px 12px 12px;
      font-size: 0.95rem;
      line-height: 1.25rem;
      font-weight: 400;
      opacity: 0.95;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: calc(1.25rem * 2);
    }

    .loading, .error-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #ffffff;
      background-color: #2d2d2d;
      border-radius: 12px;
      font-size: 1.1rem;
    }
    .error-message {
      color: #ff6b6b;
      border: 1px solid #ff6b6b;
    }

    @media screen and (max-width: 1024px) {
      #video-container { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    }

    @media screen and (max-width: 480px) {
      body { padding: 10px; }
      #video-container { grid-template-columns: 1fr; gap: 15px; }
      h1 { margin-bottom: 18px; }
      .play-icon { width: 50px; height: 50px; font-size: 26px; }
    }

    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: #2d2d2d; }
    ::-webkit-scrollbar-thumb { background: #666; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #888; }
  </style>
</head>
<body>

  <h1>🎬 YouTube Gallery (click to load)</h1>

  <div id="video-container">
    <div class="loading">Φόρτωση λίστας...</div>
  </div>

  <script>
    (function() {
      "use strict";

      // ---- Βοηθητικές συναρτήσεις ----
      function getVideoId(url) {
        try {
          url = url.trim();
          const patterns = [
            /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
            /youtube\.com\/watch\?.+&v=([^&\n?#]+)/
          ];
          for (let pattern of patterns) {
            const match = url.match(pattern);
            if (match) return match[1];
          }
          const urlObj = new URL(url);
          return urlObj.searchParams.get('v');
        } catch (e) {
          console.error('Error parsing URL:', url, e);
          return null;
        }
      }

      // Θα χρησιμοποιήσουμε την υψηλότερη ανάλυση thumbnail διαθέσιμη
      function getThumbnailUrl(videoId) {
        // maxresdefault.jpg (υψηλή ποιότητα) αν υπάρχει, αλλιώς το hqdefault.
        // Μπορούμε να δώσουμε hqdefault για σιγουριά.
        return `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
      }

      // Δημιουργία του embed link (ίδιο με πριν)
      const EMBED_BASE = "https://www.youtube-nocookie.com/embed/";
      function buildEmbedSrc(videoId) {
        const params = new URLSearchParams({
          autoplay: "1",            // να παίζει μόλις φορτωθεί το iframe (θέλουμε να παίζει μετά το κλικ)
          rel: "0",
          modestbranding: "1",
          playsinline: "1"
        });
        return `${EMBED_BASE}${videoId}?${params.toString()}`;
      }

      // ---- Cache για τίτλους (ίδιο) ----
      const titleCache = new Map();
      async function fetchTitle(videoId) {
        if (titleCache.has(videoId)) return titleCache.get(videoId);

        const oembedUrl = `https://www.youtube.com/oembed?url=${encodeURIComponent("https://www.youtube.com/watch?v=" + videoId)}&format=json`;

        try {
          const res = await fetch(oembedUrl);
          if (!res.ok) throw new Error("oEmbed failed");
          const data = await res.json();
          const title = (data && data.title) ? data.title : "YouTube Video";
          titleCache.set(videoId, title);
          return title;
        } catch (e) {
          console.warn("Title fetch failed for", videoId, e);
          const fallback = "YouTube Video";
          titleCache.set(videoId, fallback);
          return fallback;
        }
      }

      // ---- Κεντρική ροή ----
      const container = document.getElementById('video-container');

      fetch('./data/links.txt')
        .then(response => {
          if (!response.ok) {
            throw new Error(`Το αρχείο data/links.txt δεν βρέθηκε (Status: ${response.status})`);
          }
          return response.text();
        })
        .then(async (text) => {
          container.innerHTML = ''; // αφαιρούμε το loading

          const links = text.split('\n')
            .map(line => line.trim())
            .filter(line => line && !line.startsWith('#'));

          if (links.length === 0) {
            container.innerHTML = '<div class="error-message">Δεν βρέθηκαν links στο αρχείο</div>';
            return;
          }

          // Θα κρατάμε αναφορές για κάθε κάρτα: videoId, title element, media div
          const cardsData = [];

          for (let [idx, link] of links.entries()) {
            const videoId = getVideoId(link);
            if (!videoId || videoId.length !== 11) continue;

            // Δημιουργία στοιχείων
            const card = document.createElement('div');
            card.className = 'video-card';

            const mediaDiv = document.createElement('div');
            mediaDiv.className = 'video-media';

            // 1. thumbnail (στατικό)
            const img = document.createElement('img');
            img.className = 'thumbnail-img';
            img.src = getThumbnailUrl(videoId);
            img.alt = '';
            img.loading = idx < 6 ? 'eager' : 'lazy'; // τα πρώτα 6 eager
            img.width = 640;  // αναλογία διαστάσεων
            img.height = 360;

            // 2. overlay play για αισθητική
            const overlay = document.createElement('div');
            overlay.className = 'play-overlay';
            overlay.innerHTML = '<div class="play-icon">▶</div>';

            // 3. iframe (δεν τοποθετείται ακόμα, θα μπει δυναμικά στο κλικ)
            // Αποθηκεύουμε μόνο τα δεδομένα

            mediaDiv.appendChild(img);
            mediaDiv.appendChild(overlay);

            const titleDiv = document.createElement('div');
            titleDiv.className = 'video-title';
            titleDiv.id = `title-${idx}`;
            titleDiv.textContent = '...'; // προσωρινά

            card.appendChild(mediaDiv);
            card.appendChild(titleDiv);
            container.appendChild(card);

            cardsData.push({
              card: card,
              mediaDiv: mediaDiv,
              videoId: videoId,
              titleEl: titleDiv,
              iframeLoaded: false      // για να μην ξαναφορτώσουμε
            });

            // Προσθήκη event listener μία φορά
            card.addEventListener('click', createClickHandler(cardsData[cardsData.length-1]));
          }

          // Συνάρτηση που δημιουργεί handler για κλικ
          function createClickHandler(cardItem) {
            return function onClick(event) {
              // Αν ήδη φορτώθηκε iframe, δεν κάνουμε τίποτα (μπορούμε να το αφήσουμε ή να ανοίξουμε αλλού)
              if (cardItem.iframeLoaded) return;

              const media = cardItem.mediaDiv;
              const videoId = cardItem.videoId;

              // Αφαιρούμε το thumbnail και το overlay — θα μπει το iframe
              // Καθαρισμός περιεχομένου (κρατάμε μόνο το iframe)
              // αλλά μπορούμε απλά να αντικαταστήσουμε τα πάντα
              media.innerHTML = ''; // σβήνει img + overlay

              const iframe = document.createElement('iframe');
              iframe.src = buildEmbedSrc(videoId);
              iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
              iframe.allowFullscreen = true;
              iframe.loading = "eager";
              iframe.referrerPolicy = "strict-origin-when-cross-origin";
              iframe.title = "YouTube video player";

              media.appendChild(iframe);
              cardItem.iframeLoaded = true;
            };
          }

          // ---- Φόρτωση τίτλων (όπως πριν, σε βήματα) ----
          let titleIdx = 0;
          function pumpTitles() {
            const batch = 6;
            const end = Math.min(titleIdx + batch, cardsData.length);
            for (; titleIdx < end; titleIdx++) {
              const item = cardsData[titleIdx];
              fetchTitle(item.videoId).then(t => item.titleEl.textContent = t);
            }
            if (titleIdx < cardsData.length) setTimeout(pumpTitles, 250);
          }
          pumpTitles();
        })
        .catch(error => {
          console.error(error);
          container.innerHTML = `
            <div class="error-message">
              ❌ Σφάλμα: ${error.message}<br><br>
              Βεβαιώσου ότι:<br>
              1. Το αρχείο <b>data/links.txt</b> υπάρχει στο repository<br>
              2. Το <b>index.html</b> είναι στο root (ή στο Pages root)<br>
              3. Τα links είναι σωστά (ένα σε κάθε γραμμή)<br><br>
              Tip: άνοιξε DevTools → Console για να δεις το ακριβές error.
            </div>`;
        });
    })();
  </script>
</body>
</html>
