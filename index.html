<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>YouTube Videos - Dark Mode</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      color: #ffffff;
      text-align: center;
      margin-bottom: 30px;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 400;
      letter-spacing: 1px;
    }

    #video-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Κάρτα */
    .video-card {
      background-color: #2d2d2d;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 12px rgba(0,0,0,0.4);
    }

    /* Media (16:10) */
    .video-media {
      position: relative;
      width: 100%;
      padding-bottom: 62.5%; /* 16:10 */
      background: #000;
    }

    .video-media iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    /* Placeholder όσο δεν έχει φορτώσει */
    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.85);
      font-size: 0.95rem;
      letter-spacing: 0.2px;
    }

    /* Title κάτω από το video */
    .video-title {
      color: #fff;
      padding: 10px 12px 12px;
      font-size: 0.95rem;
      line-height: 1.25rem;
      font-weight: 400;
      opacity: 0.95;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: calc(1.25rem * 2);
    }

    .loading, .error-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #ffffff;
      background-color: #2d2d2d;
      border-radius: 12px;
      font-size: 1.1rem;
    }

    .error-message {
      color: #ff6b6b;
      border: 1px solid #ff6b6b;
    }

    @media screen and (max-width: 768px) {
      body { padding: 10px; }
      #video-container { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .video-card { border-radius: 8px; }
    }

    @media screen and (max-width: 480px) {
      #video-container { grid-template-columns: 1fr; gap: 15px; }
      h1 { margin-bottom: 20px; }
    }

    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: #2d2d2d; }
    ::-webkit-scrollbar-thumb { background: #666; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #888; }
  </style>
</head>

<body>
  <h1>YouTube Videos</h1>

  <div id="video-container">
    <div class="loading">Φόρτωση βίντεο...</div>
  </div>

  <script>
    function getVideoId(url) {
      try {
        url = url.trim();
        const patterns = [
          /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
          /youtube\.com\/watch\?.+&v=([^&\n?#]+)/
        ];
        for (let pattern of patterns) {
          const match = url.match(pattern);
          if (match) return match[1];
        }
        const urlObj = new URL(url);
        return urlObj.searchParams.get('v');
      } catch (e) {
        console.error('Error parsing URL:', url);
        return null;
      }
    }

    // Embeds (privacy-enhanced)
    const EMBED_BASE = "https://www.youtube-nocookie.com/embed/";

    // Title cache
    const titleCache = new Map();
    async function fetchTitle(videoId) {
      if (titleCache.has(videoId)) return titleCache.get(videoId);

      const oembedUrl =
        `https://www.youtube.com/oembed?url=${encodeURIComponent("https://www.youtube.com/watch?v=" + videoId)}&format=json`;

      try {
        const res = await fetch(oembedUrl);
        if (!res.ok) throw new Error("oEmbed failed");
        const data = await res.json();
        const title = (data && data.title) ? data.title : "YouTube Video";
        titleCache.set(videoId, title);
        return title;
      } catch {
        const fallback = "YouTube Video";
        titleCache.set(videoId, fallback);
        return fallback;
      }
    }

    // YouTube IFrame API (best-effort για ποιότητα)
    // Σημείωση: δεν εγγυάται 2160p, αλλά προσπαθεί.
    let ytApiReady = false;
    const pendingPlayers = [];

    function loadYouTubeApiOnce() {
      if (document.getElementById('yt-iframe-api')) return;
      const tag = document.createElement('script');
      tag.id = 'yt-iframe-api';
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
    }

    window.onYouTubeIframeAPIReady = function() {
      ytApiReady = true;
      // Δημιούργησε players για όσα περιμένουν
      while (pendingPlayers.length) {
        const { iframeId } = pendingPlayers.shift();
        tryMakePlayer(iframeId);
      }
    };

    const players = new Map();
    function tryMakePlayer(iframeId) {
      if (!ytApiReady || !window.YT || !YT.Player) {
        pendingPlayers.push({ iframeId });
        return;
      }
      if (players.has(iframeId)) return;

      const p = new YT.Player(iframeId, {
        events: {
          onReady: (e) => {
            try { e.target.setPlaybackQuality('hd2160'); } catch {}
          },
          onStateChange: (e) => {
            // Όταν ξεκινάει playback, ξαναπροσπάθησε να το σπρώξεις σε 2160p
            if (e.data === YT.PlayerState.PLAYING) {
              try { e.target.setPlaybackQuality('hd2160'); } catch {}
            }
          }
        }
      });
      players.set(iframeId, p);
    }

    function buildEmbedSrc(videoId) {
      // vq=hd2160: hint, όχι εγγύηση.
      // enablejsapi=1: για να καλέσουμε setPlaybackQuality.
      const params = new URLSearchParams({
        autoplay: "0",
        rel: "0",
        modestbranding: "1",
        playsinline: "1",
        enablejsapi: "1",
        vq: "hd2160"
      });
      return `${EMBED_BASE}${videoId}?${params.toString()}`;
    }

    fetch('data/links.txt')
      .then(response => {
        if (!response.ok) {
          throw new Error(`Το αρχείο data/links.txt δεν βρέθηκε (Status: ${response.status})`);
        }
        return response.text();
      })
      .then(text => {
        const container = document.getElementById('video-container');
        container.innerHTML = '';

        const links = text.split('\n')
          .map(line => line.trim())
          .filter(line => line && !line.startsWith('#'));

        if (links.length === 0) {
          container.innerHTML = '<div class="error-message">Δεν βρέθηκαν links στο αρχείο</div>';
          return;
        }

        // Φόρτωσε API (μια φορά). Δεν “βαραίνει” πολύ, αλλά το θέλουμε για best-effort 2160p.
        loadYouTubeApiOnce();

        // Observer: φορτώνει iframes + titles όταν πλησιάζουν στο viewport
        const observer = new IntersectionObserver((entries, obs) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;

            const media = entry.target;
            const videoId = media.dataset.videoId;
            const iframeId = media.dataset.iframeId;
            const titleEl = document.getElementById(`title-${videoId}`);

            // 1) Φόρτωσε iframe ΜΟΝΟ τώρα (όχι όλα μαζί)
            if (!media.dataset.iframeLoaded) {
              const iframe = document.createElement('iframe');
              iframe.id = iframeId;
              iframe.src = buildEmbedSrc(videoId);
              iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
              iframe.allowFullscreen = true;
              iframe.loading = "lazy";
              iframe.title = "YouTube video player";

              media.innerHTML = "";
              media.appendChild(iframe);

              media.dataset.iframeLoaded = "1";

              // best-effort set quality (όταν είναι έτοιμο το API)
              tryMakePlayer(iframeId);
            }

            // 2) Φόρτωσε title ΜΟΝΟ τώρα
            if (titleEl && !titleEl.dataset.titleLoaded) {
              titleEl.dataset.titleLoaded = "1";
              fetchTitle(videoId).then(t => { titleEl.textContent = t; });
            }

            obs.unobserve(media);
          }
        }, {
          root: null,
          rootMargin: "800px", // Πόσο νωρίτερα να φορτώνει πριν το δεις (αύξησέ το αν θες πιο “γρήγορο” scroll)
          threshold: 0.01
        });

        links.forEach((link, idx) => {
          const videoId = getVideoId(link);

          if (videoId && videoId.length === 11) {
            const card = document.createElement('div');
            card.className = 'video-card';

            const media = document.createElement('div');
            media.className = 'video-media';
            media.dataset.videoId = videoId;
            media.dataset.iframeId = `yt-${videoId}-${idx}`;

            // Placeholder μέχρι να έρθει κοντά στο viewport
            const ph = document.createElement('div');
            ph.className = 'video-placeholder';
            ph.textContent = 'Loading…';
            media.appendChild(ph);

            const title = document.createElement('div');
            title.className = 'video-title';
            title.id = `title-${videoId}`;
            title.textContent = '...';

            card.appendChild(media);
            card.appendChild(title);
            container.appendChild(card);

            observer.observe(media);
          } else {
            console.error('Μη έγκυρο video ID από:', link);
          }
        });
      })
      .catch(error => {
        document.getElementById('video-container').innerHTML =
          `<div class="error-message">
              ❌ Σφάλμα: ${error.message}<br><br>
              Βεβαιώσου ότι:<br>
              1. Το αρχείο data/links.txt υπάρχει στο repository<br>
              2. Το index.html είναι στο root φάκελο<br>
              3. Τα links είναι σωστά (ένα σε κάθε γραμμή)
           </div>`;
      });
  </script>
</body>
</html>
