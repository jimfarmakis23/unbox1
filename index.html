<script>
  function getVideoId(url) {
    try {
      url = url.trim();
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
        /youtube\.com\/watch\?.+&v=([^&\n?#]+)/
      ];
      for (let pattern of patterns) {
        const match = url.match(pattern);
        if (match) return match[1];
      }
      const urlObj = new URL(url);
      return urlObj.searchParams.get('v');
    } catch (e) {
      console.error('Error parsing URL:', url);
      return null;
    }
  }

  const EMBED_BASE = "https://www.youtube-nocookie.com/embed/";

  // Σημαντικό: βγάλε autoplay=1 για να μην “καίει” άσκοπα bandwidth/CPU.
  // (Αν θες autoplay ΜΟΝΟ για το πρώτο, το ρυθμίζουμε εύκολα.)
  function buildEmbedSrc(videoId) {
    const params = new URLSearchParams({
      autoplay: "0",
      rel: "0",
      modestbranding: "1",
      playsinline: "1"
    });
    return `${EMBED_BASE}${videoId}?${params.toString()}`;
  }

  // ---- Titles (oEmbed) ----
  const titleCache = new Map();
  async function fetchTitle(videoId) {
    if (titleCache.has(videoId)) return titleCache.get(videoId);

    const oembedUrl =
      `https://www.youtube.com/oembed?url=${encodeURIComponent("https://www.youtube.com/watch?v=" + videoId)}&format=json`;

    try {
      const res = await fetch(oembedUrl);
      if (!res.ok) throw new Error("oEmbed failed");
      const data = await res.json();
      const title = (data && data.title) ? data.title : "YouTube Video";
      titleCache.set(videoId, title);
      return title;
    } catch {
      const fallback = "YouTube Video";
      titleCache.set(videoId, fallback);
      return fallback;
    }
  }

  // ---- Concurrency limiter (για να μη μπουκώνει το bandwidth) ----
  const MAX_IFRAMES_IN_FLIGHT = 3;   // δοκίμασε 2 ή 3
  let inFlight = 0;
  const queue = [];

  function enqueueIframeLoad(task) {
    queue.push(task);
    pumpQueue();
  }

  function pumpQueue() {
    while (inFlight < MAX_IFRAMES_IN_FLIGHT && queue.length) {
      const task = queue.shift();
      inFlight++;
      task().finally(() => {
        inFlight--;
        pumpQueue();
      });
    }
  }

  function loadIframeInto(iframe) {
    return new Promise((resolve) => {
      if (iframe.dataset.loaded === "1") return resolve();

      const src = iframe.dataset.src;
      iframe.src = src;

      // resolve όταν φορτώσει το embed document (όχι το video stream)
      const done = () => {
        iframe.dataset.loaded = "1";
        iframe.removeEventListener("load", done);
        resolve();
      };
      iframe.addEventListener("load", done, { once: true });

      // safety: αν το load αργήσει πολύ, μην κρατάμε slot για πάντα
      setTimeout(() => {
        if (iframe.dataset.loaded !== "1") resolve();
      }, 8000);
    });
  }

  fetch('data/links.txt')
    .then(response => {
      if (!response.ok) {
        throw new Error(`Το αρχείο data/links.txt δεν βρέθηκε (Status: ${response.status})`);
      }
      return response.text();
    })
    .then(text => {
      const container = document.getElementById('video-container');
      container.innerHTML = '';

      const links = text.split('\n')
        .map(line => line.trim())
        .filter(line => line && !line.startsWith('#'));

      if (links.length === 0) {
        container.innerHTML = '<div class="error-message">Δεν βρέθηκαν links στο αρχείο</div>';
        return;
      }

      // Lazy-load iframes όταν πλησιάζουν
      const observer = new IntersectionObserver((entries, obs) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;

          const iframe = entry.target;
          const titleEl = document.getElementById(`title-${iframe.dataset.idx}`);
          const videoId = iframe.dataset.videoId;

          // Ουρά φόρτωσης iframe με limit
          if (iframe.dataset.queued !== "1") {
            iframe.dataset.queued = "1";
            enqueueIframeLoad(() => loadIframeInto(iframe));
          }

          // Title (lazy)
          if (titleEl && !titleEl.dataset.titleLoaded) {
            titleEl.dataset.titleLoaded = "1";
            fetchTitle(videoId).then(t => { titleEl.textContent = t; });
          }

          obs.unobserve(iframe);
        }
      }, {
        root: null,
        rootMargin: "800px", // ξεκινά να φορτώνει πριν φανεί
        threshold: 0.01
      });

      links.forEach((link, idx) => {
        const videoId = getVideoId(link);
        if (!videoId || videoId.length !== 11) return;

        const card = document.createElement('div');
        card.className = 'video-card';

        const media = document.createElement('div');
        media.className = 'video-media';

        // Δημιουργούμε iframe από την αρχή, αλλά χωρίς src (μπαίνει όταν έρθει κοντά)
        const iframe = document.createElement('iframe');
        iframe.dataset.videoId = videoId;
        iframe.dataset.idx = String(idx);
        iframe.dataset.src = buildEmbedSrc(videoId);

        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        iframe.allowFullscreen = true;

        // hint στον browser
        iframe.loading = "lazy";
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        iframe.title = "YouTube video player";

        // προαιρετικό: μικρό placeholder background
        iframe.style.background = "#000";

        media.appendChild(iframe);

        const title = document.createElement('div');
        title.className = 'video-title';
        title.id = `title-${idx}`;
        title.textContent = '...';

        card.appendChild(media);
        card.appendChild(title);
        container.appendChild(card);

        observer.observe(iframe);
      });

      // Boost: φόρτωσε τα πρώτα 2–3 αμέσως (για να φαίνεται “instant” πάνω-πάνω)
      const boost = Math.min(3, container.querySelectorAll('iframe').length);
      const iframes = container.querySelectorAll('iframe');
      for (let i = 0; i < boost; i++) {
        const iframe = iframes[i];
        if (iframe && iframe.dataset.queued !== "1") {
          iframe.dataset.queued = "1";
          enqueueIframeLoad(() => loadIframeInto(iframe));
        }
      }
    })
    .catch(error => {
      document.getElementById('video-container').innerHTML =
        `<div class="error-message">
            ❌ Σφάλμα: ${error.message}<br><br>
            Βεβαιώσου ότι:<br>
            1. Το αρχείο data/links.txt υπάρχει στο repository<br>
            2. Το index.html είναι στο root φάκελο<br>
            3. Τα links είναι σωστά (ένα σε κάθε γραμμή)
         </div>`;
    });
</script>
