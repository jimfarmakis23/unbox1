<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>YouTube Videos - Dark Mode</title>
  <meta name="description" content="Συλλογή από YouTube βίντεο σε dark mode">
  <meta property="og:title" content="YouTube Videos Collection">
  <meta property="og:type" content="website">
  <meta property="og:description" content="Συλλογή από YouTube βίντεο σε dark mode">

  <!-- Speed up connection setup -->
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://i.ytimg.com">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      color: #ffffff;
      text-align: center;
      margin-bottom: 26px;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 400;
      letter-spacing: 1px;
    }

    #video-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      max-width: 1680px;
      margin: 0 auto;
    }

    .video-card {
      background-color: #2d2d2d;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      will-change: transform;
    }
    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 12px rgba(0,0,0,0.4);
    }
    .video-card:focus-within {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .video-media {
      position: relative;
      width: 100%;
      padding-bottom: 62.5%;
      background: #000;
    }
    .video-media iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .video-title {
      color: #fff;
      padding: 10px 12px 12px;
      font-size: 0.95rem;
      line-height: 1.25rem;
      font-weight: 400;
      opacity: 0.95;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: calc(1.25rem * 2);
      word-break: break-word;
    }

    .loading, .error-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #ffffff;
      background-color: #2d2d2d;
      border-radius: 12px;
      font-size: 1.1rem;
    }
    .error-message {
      color: #ff6b6b;
      border: 1px solid #ff6b6b;
    }

    @media screen and (max-width: 1024px) {
      #video-container { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    }

    @media screen and (max-width: 480px) {
      body { padding: 10px; }
      #video-container { grid-template-columns: 1fr; gap: 15px; }
      h1 { margin-bottom: 18px; }
    }

    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: #2d2d2d; }
    ::-webkit-scrollbar-thumb { background: #666; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #888; }
  </style>
</head>

<body>
  <h1>YouTube Videos</h1>

  <div id="video-container">
    <div class="loading">Φόρτωση βίντεο...</div>
  </div>

  <script>
    // Utility function for retry mechanism
    async function fetchWithRetry(url, maxRetries = 3) {
      for (let i = 0; i < maxRetries; i++) {
        try {
          const response = await fetch(url);
          if (response.ok) return response;
        } catch (e) {
          if (i === maxRetries - 1) throw e;
          await new Promise(resolve => setTimeout(resolve, 1000 * Math.pow(2, i)));
        }
      }
    }

    function getVideoId(url) {
      try {
        url = url.trim();
        // Unified pattern for all YouTube URL formats
        const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/watch\?.+&v=)([^&\n?#]+)/);
        if (match) return match[1];
        
        // Fallback to URL parsing
        const urlObj = new URL(url);
        return urlObj.searchParams.get('v');
      } catch (e) {
        console.error('Error parsing URL:', url, e);
        return null;
      }
    }

    const EMBED_BASE = "https://www.youtube-nocookie.com/embed/";

    function buildEmbedSrc(videoId) {
      const params = new URLSearchParams({
        autoplay: "0",
        rel: "0",
        modestbranding: "1",
        playsinline: "1"
      });
      return `${EMBED_BASE}${videoId}?${params.toString()}`;
    }

    // Titles with cache and fallback
    const titleCache = new Map();
    async function fetchTitle(videoId) {
      if (titleCache.has(videoId)) return titleCache.get(videoId);

      const oembedUrl = `https://www.youtube.com/oembed?url=${encodeURIComponent("https://www.youtube.com/watch?v=" + videoId)}&format=json`;

      try {
        const res = await fetchWithRetry(oembedUrl);
        const data = await res.json();
        const title = (data && data.title) ? data.title : "YouTube Video";
        titleCache.set(videoId, title);
        return title;
      } catch (e) {
        console.warn("Title fetch failed for", videoId, e);
        
        // Try alternative oEmbed service as fallback
        try {
          const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`);
          const data = await response.json();
          if (data.title) {
            titleCache.set(videoId, data.title);
            return data.title;
          }
        } catch {}
        
        const fallback = "YouTube Video";
        titleCache.set(videoId, fallback);
        return fallback;
      }
    }

    // Initialize Intersection Observer for lazy loading
    function initIntersectionObserver(iframes) {
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const iframe = entry.target;
              if (iframe.dataset.src && !iframe.src) {
                iframe.src = iframe.dataset.src;
                observer.unobserve(iframe); // Stop observing once loaded
              }
            }
          });
        }, {
          rootMargin: '200px', // Load a bit before they come into view
          threshold: 0.1
        });

        iframes.forEach(({ iframe, videoId }) => {
          iframe.dataset.src = buildEmbedSrc(videoId);
          iframe.src = ''; // Initially empty
          observer.observe(iframe);
        });

        return true;
      }
      return false;
    }

    // Main execution
    fetch('./data/links.txt')
      .then(response => {
        if (!response.ok) {
          throw new Error(`Το αρχείο data/links.txt δεν βρέθηκε (Status: ${response.status})`);
        }
        return response.text();
      })
      .then(text => {
        const container = document.getElementById('video-container');
        container.innerHTML = '';

        const links = text.split('\n')
          .map(line => line.trim())
          .filter(line => line && !line.startsWith('#'));

        if (links.length === 0) {
          container.innerHTML = '<div class="error-message">Δεν βρέθηκαν links στο αρχείο</div>';
          return;
        }

        const iframes = [];

        links.forEach((link, idx) => {
          const videoId = getVideoId(link);
          if (!videoId || videoId.length !== 11) return;

          const card = document.createElement('div');
          card.className = 'video-card';
          card.setAttribute('tabindex', '0'); // Make focusable

          const media = document.createElement('div');
          media.className = 'video-media';

          const iframe = document.createElement('iframe');
          iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
          iframe.allowFullscreen = true;
          iframe.referrerPolicy = "strict-origin-when-cross-origin";
          iframe.title = "YouTube video player";

          media.appendChild(iframe);

          const title = document.createElement('div');
          title.className = 'video-title';
          title.id = `title-${idx}`;
          title.textContent = 'Φόρτωση...'; // Loading state

          card.appendChild(media);
          card.appendChild(title);
          container.appendChild(card);

          iframes.push({ iframe, videoId, titleEl: title, card });
        });

        // Use Intersection Observer for lazy loading
        const observerSupported = initIntersectionObserver(iframes);

        // Fallback for browsers without Intersection Observer
        if (!observerSupported) {
          iframes.forEach(({ iframe, videoId }) => {
            iframe.src = buildEmbedSrc(videoId);
          });
        }

        // Load titles in batches
        let titleIdx = 0;
        function pumpTitles() {
          const batch = 6;
          const end = Math.min(titleIdx + batch, iframes.length);
          
          const promises = [];
          for (; titleIdx < end; titleIdx++) {
            const item = iframes[titleIdx];
            const promise = fetchTitle(item.videoId)
              .then(title => {
                item.titleEl.textContent = title;
                // Add ARIA label for better accessibility
                item.card.setAttribute('aria-label', `Βίντεο: ${title}`);
              })
              .catch(() => {
                item.titleEl.textContent = 'Μη διαθέσιμο';
              });
            promises.push(promise);
          }
          
          Promise.allSettled(promises).then(() => {
            if (titleIdx < iframes.length) {
              setTimeout(pumpTitles, 250);
            }
          });
        }
        pumpTitles();

        // Eager load first 3 iframes if Intersection Observer is not used
        if (!observerSupported) {
          for (let i = 0; i < Math.min(3, iframes.length); i++) {
            iframes[i].iframe.loading = "eager";
          }
        }
      })
      .catch(error => {
        console.error(error);
        document.getElementById('video-container').innerHTML =
          `<div class="error-message">
              ❌ Σφάλμα: ${error.message}<br><br>
              Βεβαιώσου ότι:<br>
              1. Το αρχείο <b>data/links.txt</b> υπάρχει στο repository<br>
              2. Το <b>index.html</b> είναι στο root (ή στο Pages root)<br>
              3. Τα links είναι σωστά (ένα σε κάθε γραμμή)<br><br>
              Tip: άνοιξε DevTools → Console για να δεις το ακριβές error.
           </div>`;
      });
  </script>
</body>
</html>
